<script>

const mk=(w=32)=>`<svg width="${w}" height="${w}" viewBox="0 0 100 100" aria-hidden="true"><use href="#mark"/></svg>`;
/* ---- classifier (offline, context-aware rules) ---- */
const CTX_TECH=/\b(process|python|code|thread|terminal|server|app|command|task|port|script|window|program|linux|java|npm|bash|job)\b/,CTX_PET=/\b(cat|cats|kitten|kitty|pet|fluffy|meow|purr|whiskers|vet)\b/,CTX_SEX=/\b(send|show|touch|lick|want|wet|pics?|nudes?|naked|sex|horny|body)\b/;
const R=(cat,w,s,r,why)=>({cat,w,s,r,why});
const RULES=[
R('Adult or sexual content',9,'Mentions explicit adult material',/\b(porn\w*|xxx|nsfw|sex ?tape|sex videos?|nudes?|naked pics?)\b/,'This looks like adult material, which is not suitable for children.'),
R('Sexual harassment',9,'Asks for private or sexual pictures',/\b(?:send|show|share)\b.{0,10}\b(?:nudes?|naked pics?|(?:nude|sexy|private) (?:pics?|photos?))\b/,'Asking for private pictures is never okay, even from someone you know. Do not reply and tell a trusted adult.'),
R('Sexual harassment',8,'Threatens to share or tell unless you comply',/\bif you (?:dont|do not|wont|will not)\b.{0,30}\b(?:ill|i will|i ll)\b.{0,20}\b(?:post|share|tell|leak|show)\b/,'Threats used to pressure someone are a serious warning sign. You are not in trouble. Tell a trusted adult.'),
R('Violent threat',9,'A direct threat of harm toward a person',/\b(?:i|id|ill|i will|i would|im going to|im gonna|ima|we will|gonna|going to)\s+(?:kill|murder|stab|shoot|beat up|hurt)\s+(?:you|u|ya|him|her|them)\b/,'This reads like a threat of violence. Take it seriously, do not reply, and tell a trusted adult.'),
R('Violent threat',8,'Wishes serious harm on someone',/\b(?:kill|murder|stab|shoot)\s+(?:you|u|yourself|urself)\b/,'This wishes serious harm on someone. Do not reply and tell a trusted adult.'),
R('Self-harm',8,'Language about hurting oneself',/\b(?:suicide|suicidal|kill myself|end my life|want to die|self ?harm|hurt myself|cut myself)\b/,'This touches on feeling very low or hurting yourself. You are not alone and it is not your fault. Please talk to a parent, teacher or school counsellor today. If you are in immediate danger, contact local emergency services.'),
R('Secrecy request',3,'Asks to keep something from a parent or adult',/\b(?:dont|do not|never)\s+tell\s+(?:your |ur )?(?:mom|mum|mother|dad|father|parents?|teacher|anyone|anybody|guardian)\b/,'Being asked to keep something secret from a trusted adult can be a warning sign in some situations, but it is not proof of anything by itself.'),
R('Secrecy request',3,'Asks to keep the chat secret',/\bkeep (?:this|it|our chat|our conversation|us|that) (?:a )?secret\b|\bour (?:little )?secret\b|\bjust between us\b/,'Asking you to keep a chat secret can be a warning sign in some situations. Context matters.'),
R('Personal information request',5,'Asks for private details such as an address',/\b(?:give|send|tell|share|what(?:s| is))\b.{0,12}\b(?:your |ur )(?:home )?(?:address|house|phone number|number|school|full name|location)\b|\bwhere do you live\b/,'Never share your address, school or phone number with someone you only know online.'),
R('Scam or impersonation',6,'Asks for a code, PIN or password',/\b(?:send|give|share|tell|enter|confirm)\b.{0,25}\b(?:otp|pin|bvn|password|passcode|cvv|token|atm card)\b/,'Real banks and companies never ask for your OTP, PIN, BVN or password. This looks like a scam.'),
R('Scam or impersonation',4,'Offers a prize or free money',/\b(?:claim (?:your |ur )?(?:prize|reward|gift|winnings)|you(?:ve| have)? won|free money|double your money)\b/,'Surprise prizes are a common scam tactic.'),
R('Scam or impersonation',5,'Pretends to be a bank or official',/\b(?:your account (?:is|has been) (?:blocked|suspended|locked)|this is your bank|i am from (?:the )?(?:bank|cbn|efcc|police))\b/,'Scammers often pretend to be banks or officials. Check with a trusted adult using a number you already know.'),
R('Suspicious link',3,'Pushes you to click a link',/\bclick (?:on |this |the |my |here|below)?.{0,10}\b(?:link|here)\b|\bclick here\b/,'Unexpected links can lead to scams or harmful pages. Ask a trusted adult before opening.'),
R('Suspicious link',4,'Uses a shortened or unusual web address',/\b(?:bit\.ly|tinyurl\.com|t\.me|wa\.me)\b|https?:\/\/\S+\.(?:xyz|top|click|ru)\b/,'Shortened or unusual addresses hide where they lead.'),
R('Pressure tactics',2,'Pushes you to hurry',/\b(?:quickly|urgent(?:ly)?|hurry|immediately|before it expires|expires? (?:soon|today)|last chance|act now)\b/,'Pressure to hurry is used to stop people from thinking carefully.'),
R('Drugs or risky substances',5,'Mentions buying or using drugs',/\b(?:buy|sell|selling|get|smoke|snort|inject)\b.{0,12}\b(?:cocaine|heroin|weed|marijuana|meth|tramadol|codeine|molly|crack)\b|\bdrugs? for sale\b/,'This may involve illegal or harmful substances, which are unsafe for young people.'),
R('Gambling',3,'Mentions gambling or betting sites',/\b(?:casino|jackpot|betting|gambl\w+|slot machines?|bet9ja|sportybet|1xbet|place a bet)\b/,'Gambling is age-restricted and can lead to losing money. Ask a trusted adult.'),
R('Bullying or insults',5,'Insults aimed at a person',/\byou(?:re| are| r)?\s+(?:so |such a |a )?(?:stupid|ugly|dumb|fat|useless|worthless|idiot|loser)\b|\bnobody likes you\b/,'This sounds like bullying. Words online can hurt. If it is aimed at you, tell a trusted adult.'),
R('Bullying or insults',3,'Possible disguised insult (a swapped-in word)',/\bduck (?:you|u|off|head)\b|\byou(?:re| are| r)? (?:a )?(?:big )?duck\b/,'This might be a disguised insult, but a word like this can also be innocent. Look at who sent it and how.')];
function variants(t){const a=t.toLowerCase().replace(/[’'`]/g,''),l=a.replace(/[0@]/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t');
const d=s=>s.replace(/\b(?:[a-z][\s._-]){2,}[a-z]\b/g,m=>m.replace(/[\s._-]/g,'')).replace(/(.)\1{2,}/g,'$1$1');return[...new Set([a,l,d(a),d(l)])]}
function ambiguous(v,n){const o=[];
if(/\b(?:kill|murder)\b/.test(v)&&!CTX_TECH.test(v)&&!n)o.push(['Violent wording',2,'Uses a word that can mean harm, with no clear context','Words like this can be harmless (a game, a joke, a computer command) or a threat. One word alone does not show the intent.']);
if(/\bpuss(?:y|ies)\b/.test(v)&&!CTX_PET.test(v))o.push(CTX_SEX.test(v)?['Adult or sexual content',8,'Sexual wording suggested by nearby words','This word can mean a cat, but the words around it suggest an adult meaning. Do not reply, and tell a trusted adult.']:['Unclear wording',3,'A word with more than one meaning and no context','This word has several meanings. Without more context we cannot tell what is meant.']);return o}
function classify(t){const V=variants(t),hits=RULES.filter(x=>V.some(v=>x.r.test(v)));
ambiguous(V.join(' '),hits.length).forEach(a=>hits.push({cat:a[0],w:a[1],s:a[2],why:a[3]}));
if(!hits.length)return{verdict:'Safe',score:0,cat:'None found',sig:[],why:'No warning signs were found by our simple rules. That is not a guarantee. If something feels wrong, ask a trusted adult.',conf:'Rules only check known patterns, so they can miss things.'};
hits.sort((a,b)=>b.w-a.w);const top=hits[0],sh=top.cat==='Self-harm',score=Math.min(10,Math.round(top.w+1.5*(hits.length-1)));
return{verdict:sh?'Caution':score>=7?'Blocked':score>=4?'Caution':'Needs a closer look',score,cat:top.cat,sig:[...new Set(hits.map(h=>h.s))],why:top.why,support:sh,
conf:hits.length>1?'Several warning signals appeared together, so confidence is higher. It is still not proof of anyone’s intent.':'Only one signal was found, so confidence is low. Context could change the meaning.'}}
const ICON={Safe:'✓',Caution:'!',Blocked:'✕',Needs:'?'},NEXT={Blocked:'Do not reply or click anything. Show a trusted adult. Safer things to search: staying safe online, how to report bullying, science experiments for students.',Caution:'Pause before replying or clicking. Do not share personal details. Ask a trusted adult to look with you.',Needs:'Read it again in context. If it came from a person, ask a trusted adult what they think.',Safe:'Nothing alarming was found. Keep thinking before you click or share.',Support:'Please talk to a trusted adult today. You do not have to handle this alone.'};
function resHTML(r,src){const k=r.verdict.split(' ')[0];return `<div class="v ${k}"><span aria-hidden="true">${ICON[k]}</span>${r.verdict}</div> <span class="pill">${esc(r.cat)}</span>
${r.support?'<p style="margin-top:12px"><b>You matter.</b></p>':`<div class="meter ${k}" role="img" aria-label="Risk score ${r.score} out of 10"><i data-s="${r.score/10}"></i></div><p class="num"><b>Risk score: ${r.score} / 10</b></p>`}
<p style="margin-top:8px">${esc(r.why)}</p>${r.sig.length?`<p style="margin-top:8px"><b>Signals noticed:</b></p><ul style="padding-left:1.2em">${r.sig.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
<p style="margin-top:8px"><b>What to do:</b> ${NEXT[r.support?'Support':k]}</p><p class="note" style="margin-top:8px">${esc(r.conf||'')}</p><p class="note">Source: ${esc(src)}. This is not a guarantee: rules can wrongly flag harmless text and miss real risks.</p>`}
const anim=r=>{$$('.res',r).forEach(x=>{if(!RM()&&x.animate)x.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:'ease-out'})});requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.meter i',r).forEach(i=>i.style.transform=`scaleX(${i.dataset.s})`)))};
const SRC='Offline rule engine (runs in your browser; nothing is sent anywhere)';
/* ---- data ---- */
const LESSONS=[
{t:'Recognising online scams',q:'A message says "You won N500,000! Send your BVN to claim." What do you do?',o:['Send the BVN quickly','Ignore it and tell a trusted adult','Reply asking for more details'],a:1,e:'Real prizes never need your BVN. Scammers create pressure so you act without thinking.'},
{t:'Creating stronger passwords',q:'Which password is strongest?',o:['password123','MyName2010','Mango-Drum-Lagos-Rain-47'],a:2,e:'Long passphrases made of unrelated words are hard to guess and easy to remember.'},
{t:'Being kind online',q:'A classmate posts something embarrassing. What is the kind choice?',o:['Share it as a joke','Do not share it and be supportive','Comment something mean'],a:1,e:'Kindness online matters just as much as in person. Once shared, things are hard to take back.'},
{t:'Recognising suspicious links',q:'Which link needs the most caution?',o:['A link from a shortener in an unexpected message','Your school website typed by you','A link on a trusted app’s official page'],a:0,e:'Shortened links hide their destination. Check with an adult before opening unexpected links.'},
{t:'Protecting personal information',q:'A stranger online asks where you live and your school. What do you do?',o:['Tell them, they seem nice','Share only your school','Do not share and tell a trusted adult'],a:2,e:'Personal details can be misused. Keep them private from people you only know online.'},
{t:'Knowing when to speak to a trusted adult',q:'Something online makes you feel scared or uncomfortable. What helps most?',o:['Keep it secret','Tell a parent, teacher or counsellor','Delete everything and say nothing'],a:1,e:'You are never in trouble for asking for help. Trusted adults can help you stay safe.'}];
const SAMPLE=[['Inappropriate content','Mon','09:14'],['Scam message','Mon','17:40'],['Unsafe link','Tue','12:05'],['Bullying language','Tue','19:22'],['Scam message','Wed','08:31'],['Unsafe link','Wed','15:47'],['Inappropriate content','Thu','20:10'],['Scam message','Thu','21:03'],['Unsafe link','Fri','13:26'],['Bullying language','Sat','10:50'],['Scam message','Sat','16:18'],['Unsafe link','Sun','11:09']];
const TEAM0={school:'IMMACULATE HEARTS COMPREHENSIVE SENIOR HIGH SCHOOL',names:['Oyewole Gbolarin Enoch','Yusuf Ridwanullahi Adeleke','Olufayo Oluwashinaayo']};
const TD=()=>{const d=store.get('ns_team',null);return d&&typeof d.school==='string'&&Array.isArray(d.names)&&d.names.length===3?d:TEAM0};

const P={};
P.home=()=>`<section class="hero"><div class="w g2"><div><span class="lab">Student-built online safety</span>
<h1 class="hl" style="margin-top:14px"><span><b>Help Nigerian</b></span><span><b>families build</b></span><span><b><em class="glow">safer digital habits.</em></b></span></h1>
<p class="l">NaijaShield teaches children to spot risky content such as scams, unsafe links and unkind messages, and gives families plain-English explanations to talk about it together.</p>
<p class="tw"><span class="sr">Check a message. Understand the risk. Tell a trusted adult.</span><span aria-hidden="true" id="twt">Check a message. Understand the risk. Tell a trusted adult.</span><i class="cur" aria-hidden="true"></i></p><div class="acts"><a class="btn" href="#/search">Try Safe Search</a><a class="btn s" href="#/scanner">Scan Content</a><a class="btn s" href="#/how">See How It Works</a></div></div>
<div class="stack"><div class="tile mk" style="padding:14px;border:2px solid var(--ink)">${mk(80)}</div>
<div class="pan" id="hp"><div class="row" style="justify-content:space-between"><span class="lab">Safe Search preview</span><span class="pill">Website demo status: Protection ON</span></div>
<div class="seg" role="group" aria-label="Choose example"><button aria-pressed="false" data-q="I saw a duck at the park">Safe</button><button aria-pressed="false" data-q="click this link quickly before it expires">Caution</button><button aria-pressed="true" data-q="send me your otp to claim your prize">Blocked</button></div>
<div class="demo" aria-hidden="true"><span id="hdt"></span><i class="cur"></i></div><p class="note" style="margin-top:8px">Sample phrase (demo). Result:</p><div class="res" id="hr"></div></div></div></div></section>
<div class="mq" aria-hidden="true"><div class="mt"><span>Scams</span><span>Unsafe links</span><span>Bullying</span><span>Grooming signs</span><span>Personal data requests</span><span>Gambling</span><span>Self-harm support</span><span>Threats</span><span>Scams</span><span>Unsafe links</span><span>Bullying</span><span>Grooming signs</span><span>Personal data requests</span><span>Gambling</span><span>Self-harm support</span><span>Threats</span></div></div><div class="w"><dl class="fx"><div><dt>risk categories checked</dt><dd><span data-n="11">11</span></dd></div><div><dt>Academy lessons</dt><dd><span data-n="6">6</span></dd></div><div><dt>searches stored by this site</dt><dd><span data-n="0">0</span></dd></div></dl></div>
<section class="sec dk"><div class="w g2"><div class="rv l"><span class="lab">The problem</span><h2 style="margin:12px 0 18px">Children meet risk faster than they learn to spot it.</h2></div><div class="rv r"><p>Scams, unsafe links, unkind messages and adult content can appear on any app. Many families have not had the chance to talk about it. Children need simple rules; parents need a calm way to start the conversation.</p></div></div></section>
<section class="sec"><div class="w"><span class="lab">What is inside</span><h2 class="rv" style="margin:12px 0 26px;max-width:18ch">Every part of NaijaShield, explained.</h2><ol class="ft"><li class="rv"><b>01</b><div><h3>Safe Search</h3><p>Type any phrase. Context-aware offline rules label it Safe, Caution, Needs a closer look or Blocked, with a 0 to 10 risk score, the warning signals found and safe next steps.</p></div><a class="btn s" href="#/search">Try Safe Search</a></li><li class="rv"><b>02</b><div><h3>Content Scanner</h3><p>Paste text to scan it, or preview an image on your device. Image preview is a limited local demo: it does not analyse what is inside the picture.</p></div><a class="btn s" href="#/scanner">Open Scanner</a></li><li class="rv"><b>03</b><div><h3>Parent Dashboard</h3><p>A demo of what a parent could see: fictional sample alerts with category and time only, filters and a chart. It is not connected to real children.</p></div><a class="btn s" href="#/parent">Open Dashboard</a></li><li class="rv"><b>04</b><div><h3>Safety Academy</h3><p>A growing quiz library with randomized rounds, points, timed challenges, sound effects, explanations and locally saved scores.</p></div><a class="btn s" href="#/academy">Start Learning</a></li><li class="rv"><b>05</b><div><h3>Meet our team</h3><p>The three students who built NaijaShield. Open each profile, add a photo locally and edit names and school details.</p></div><a class="btn s" href="#/team">Meet the team</a></li><li class="rv"><b>06</b><div><h3>Android app</h3><p>Install guide for the Android app. The download button switches on only when a real release link is configured.</p></div><a class="btn s" href="#/download">See Android page</a></li><li class="rv"><b>07</b><div><h3>How it works</h3><p>An animated diagram of how checks flow, plus privacy, current limits and the roadmap.</p></div><a class="btn s" href="#/how">See How It Works</a></li><li class="rv"><b>08</b><div><h3>Contact</h3><p>A validated message form. Delivery works only when a contact service is connected, and the page says so honestly.</p></div><a class="btn s" href="#/contact">Contact us</a></li></ol></div></section>
<section class="sec dk f"><div class="w g2"><div class="rv"><span class="lab">Privacy by design</span><h2 style="margin:12px 0 18px">What you type stays on your device.</h2><p>Searches, scanned text and images are never stored, uploaded or sent to analytics. Parent alerts, when built for production, will only show a category and a time.</p></div><div class="rv r"><div class="big num">0</div><p>searches saved by this website.</p></div></div></section>
<section class="sec"><div class="w g2"><div class="rv l"><span class="lab">Safety Academy</span><h2 style="margin:12px 0 16px">Six lessons, one habit each.</h2><p>Scams, passwords, kindness, links, personal information and when to ask a trusted adult.</p><p style="margin-top:20px"><a class="btn" href="#/academy">Start learning</a></p></div><div class="pan rv r"><ol class="st">${LESSONS.map(l=>`<li>${l.t}</li>`).join('')}</ol></div></div></section>

const txt='Check a message. Understand the risk. Tell a trusted adult.',tw=$('#twt',r);
if(RM()){sh(ph,2);tw.textContent=txt;$('.tw .cur',r).remove()}else{

$$('[role=tab]',r).forEach(b=>b.onclick=()=>{$$('[role=tab]',r).forEach(x=>x.setAttribute('aria-selected',x===b));$('#tp',r).hidden=b.dataset.m!=='t';$('#ip',r).hidden=b.dataset.m!=='i'});

rel();url=URL.createObjectURL(f);const fl=/nsfw|nude|explicit|xxx|porn/i.test(f.name),pi=$('#pi',r);pi.src=url;pi.classList.toggle('bl',fl);$('#ia',r).hidden=false;$('#rv',r).hidden=!fl;$('#rv',r).textContent='Reveal image';$('#rv',r).setAttribute('aria-pressed','false');
$('#im',r).textContent=fl?'Demo heuristic flagged this file name. The preview is blurred by default.':'Demo heuristic found nothing in the file name. This is not proof the image is safe.';say($('#im',r).textContent)};
$('#rv',r).onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'Hide image':'Reveal image';$('#pi',r).classList.toggle('bl',!on)}};
P.parent=()=>`<section class="sec"><div class="w"><span class="lab">Parent Dashboard</span><h1 style="font-size:clamp(2.2rem,6vw,4rem);margin:12px 0 14px">A calm weekly summary.</h1><p class="pill" style="background:var(--ca);margin-bottom:18px">DEMO DATA — fictional sample alerts, not real child activity.</p>

I.parent=r=>{const cats=['All',...new Set(SAMPLE.map(a=>a[0]))];let f='All';const draw=()=>{$('#pf',r).innerHTML=cats.map(c=>`<button aria-pressed="${c===f}" data-c="${esc(c)}">${esc(c)}</button>`).join('')+'<button data-r="1">Reset</button>';
const list=SAMPLE.filter(a=>f==='All'||a[0]===f);$('#pc',r).textContent=`This week: ${list.length} sample alert${list.length===1?'':'s'} (${f})`;
const cnt={};list.forEach(a=>cnt[a[0]]=(cnt[a[0]]||0)+1);const mx=Math.max(1,...Object.values(cnt));

$('#pt',r).innerHTML=list.length?list.map(a=>`<tr><td>${esc(a[0])}</td><td>${a[1]}</td><td class="num">${a[2]}</td></tr>`).join(''):'<tr><td colspan="3">No sample alerts match this category.</td></tr>';
$$('#pf button',r).forEach(b=>b.onclick=()=>{f=b.dataset.r?'All':b.dataset.c;draw()})};draw()};

const tb=$('#tb');function theme(t,save){const h=document.documentElement;if(save&&!RM()){h.classList.add('tt');setTimeout(()=>h.classList.remove('tt'),450)}h.dataset.theme=t;tb.setAttribute('aria-pressed',t==='dark');tb.setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme');$('meta[name=theme-color]').content=t==='dark'?'#043A2D':'#075543';if(save)store.set('ns_theme',t)}
theme(document.documentElement.dataset.theme||'light',false);tb.onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark',true);
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||RM())return;const b=e.target.closest&&e.target.closest('.btn');if(!b)return;const q=b.getBoundingClientRect();b.style.setProperty('--mx',((e.clientX-q.left-q.width/2)/q.width*6).toFixed(1)+'px');b.style.setProperty('--my',((e.clientY-q.top-q.height/2)/q.height*6).toFixed(1)+'px')});
document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('.btn');if(b){b.style.removeProperty('--mx');b.style.removeProperty('--my')}});
const sp=$('#sp');let tk=0;addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const m=document.documentElement.scrollHeight-innerHeight;sp.style.transform=`scaleX(${m>0?scrollY/m:0})`})},{passive:true});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const p=e.target.closest&&e.target.closest('.pan');if(!p)return;const q=p.getBoundingClientRect();p.style.setProperty('--px',e.clientX-q.left+'px');p.style.setProperty('--py',e.clientY-q.top+'px')});
/* ---- cookies and analytics ---- */
let consent=store.get('ns_consent',null);
function ga(){if(!MEASUREMENT_ID||!/^G-[A-Z0-9]+$/.test(MEASUREMENT_ID)||window.__ga)return;window.__ga=1;const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+MEASUREMENT_ID;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',MEASUREMENT_ID,{anonymize_ip:true})}
function setC(a){consent={analytics:!!a};store.set('ns_consent',consent);$('#ckb').hidden=true;if(a)ga();say('Cookie preference saved.')}
function ckUI(custom){const b=$('#ckb');b.hidden=false;b.innerHTML=`<b>Cookie choices</b><p style="margin-top:6px">NaijaShield works fully without cookies. Analytics are optional${MEASUREMENT_ID?'':' and not configured on this site'}, and never include what you type or upload.</p>${custom?`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="ac" style="width:22px" ${consent&&consent.analytics?'checked':''}> Allow analytics</label><div class="row"><button class="btn" id="cv">Save</button></div>`:`<div class="row"><button class="btn" id="ca">Accept</button><button class="btn s" id="cr">Reject</button><button class="btn s" id="cu">Customize</button></div>`}`;
if(custom)$('#cv').onclick=()=>setC($('#ac').checked);else{$('#ca').onclick=()=>setC(true);$('#cr').onclick=()=>setC(false);$('#cu').onclick=()=>ckUI(true)}b.querySelector('button').focus()}
$('#cks').onclick=()=>ckUI(true);
if(consent==null)ckUI(false);else if(consent.analytics)ga();
route();
</script>
